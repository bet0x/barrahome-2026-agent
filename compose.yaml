# Local development stack. The container keeps Docker's default seccomp profile
# and holds CAP_SYS_PTRACE, which is what that profile requires before it will
# permit pidfd_getfd (moby#45622) — the syscall the supervisor uses to duplicate
# the worker's descriptors. Without the capability sandlock cannot create a
# sandbox at all and the supervisor exits instead of serving unconfined.
#
# Do not replace this with seccomp=unconfined. That was the workaround here
# until 2026/09 and it gives up Docker's whole syscall filter to buy nothing:
# the capability alone is enough. The worker does not get to keep the
# privilege — sandlock's default blocklist denies the child ptrace and
# process_vm_readv/writev, and internal/sandbox adds pidfd_getfd.
services:
  agent:
    image: barrahome-agent:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barrahome-agent
    restart: unless-stopped
    env_file: .env
    environment:
      # .env's BARRAHOME_WORKSPACE is the host path used for native runs; the
      # volume below mounts it at /workspace, so the value inside the
      # container must be /workspace, not the host path.
      BARRAHOME_WORKSPACE: /workspace
      BARRAHOME_PORT: "9000"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ${BARRAHOME_WORKSPACE:-../barrahome-2026}:/workspace:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    # Must exceed the supervisor's worker-kill grace (BARRAHOME_SHUTDOWN_TIMEOUT_SEC
    # + a 10s margin, computed in cmd/barrahome-agent), or Docker's SIGKILL races
    # and wins against the app's own graceful drain. Raise both together.
    stop_grace_period: 50s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
